<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Météo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --border: #e2e8f0;
    --chip-bg: #f1f5f9;
    --error-bg: #fef2f2;
    --error-border: #fecaca;
    --error-text: #b91c1c;
    --shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
  }
  html.dark {
    --bg: #0b1120;
    --card: #111a2e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-soft: #172554;
    --border: #1e293b;
    --chip-bg: #1e293b;
    --error-bg: rgba(220, 38, 38, 0.12);
    --error-border: rgba(220, 38, 38, 0.4);
    --error-text: #fca5a5;
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: var(--bg);
  }
  html.dark .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(2, 6, 23, 0.35);
  }
  .bg-layer {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.1s ease;
    will-change: opacity;
  }
  .bg-layer.show { opacity: 1; }
  .sun {
    position: absolute;
    top: 10%;
    right: 12%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff7cc, #ffd34d 50%, rgba(255, 180, 40, 0) 72%);
    box-shadow: 0 0 50px 18px rgba(253, 224, 71, 0.45), 0 0 130px 60px rgba(253, 224, 71, 0.14);
    animation: sunPulse 8s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.92; }
  }
  .moon {
    position: absolute;
    top: 11%;
    right: 13%;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #f8fafc, #cbd5e1 75%);
    box-shadow: 0 0 36px 12px rgba(226, 232, 240, 0.35), inset -8px -8px 14px rgba(100, 116, 139, 0.5);
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation-name: twinkle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  .cloud {
    position: absolute;
    border-radius: 999px;
    filter: blur(2px);
    z-index: 1;
    animation-name: cloudDrift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform;
  }
  .cloud::before,
  .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .cloud::before {
    width: 46%;
    height: 95%;
    top: -58%;
    left: 16%;
  }
  .cloud::after {
    width: 32%;
    height: 78%;
    top: -42%;
    right: 14%;
  }
  @keyframes cloudDrift {
    from { transform: translateX(-22vw); }
    to { transform: translateX(108vw); }
  }
  .rain {
    position: absolute;
    top: 0;
    width: 2px;
    background: linear-gradient(to bottom, rgba(191, 219, 254, 0), rgba(191, 219, 254, 0.85));
    border-radius: 2px;
    animation-name: rainFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes rainFall {
    from { transform: translateY(-15vh); }
    to { transform: translateY(115vh); }
  }
  .snow {
    position: absolute;
    top: 0;
    border-radius: 50%;
    background: #fff;
    opacity: 0.95;
    animation-name: snowFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes snowFall {
    from { transform: translate3d(0, -10vh, 0); }
    to { transform: translate3d(22px, 112vh, 0); }
  }
  .fog-bank {
    position: absolute;
    left: -15%;
    width: 130%;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(to right, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0));
    filter: blur(10px);
    animation-name: fogDrift;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }
  @keyframes fogDrift {
    from { transform: translateX(-6%); }
    to { transform: translateX(6%); }
  }
  .flash {
    position: absolute;
    inset: 0;
    z-index: 5;
    background: rgba(255, 255, 255, 0.85);
    opacity: 0;
    animation-name: lightning;
    animation-timing-function: ease-out;
    animation-iteration-count: infinite;
  }
  @keyframes lightning {
    0%, 21%, 30%, 100% { opacity: 0; }
    5% { opacity: 0.7; }
    6% { opacity: 0.05; }
    7% { opacity: 0.5; }
    24% { opacity: 0.35; }
    25% { opacity: 0.02; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sun, .moon, .star, .cloud, .rain, .snow, .fog-bank, .flash {
      animation: none !important;
    }
    .bg-layer { transition: none; }
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    transition: background 0.3s, color 0.3s;
  }
  .card {
    background: rgba(255, 255, 255, 0.72);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    width: 100%;
    max-width: 680px;
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 24px 24px 16px;
    transition: background 0.3s, border-color 0.3s;
  }
  html.dark .card { background: rgba(17, 26, 46, 0.66); border-color: rgba(148, 163, 184, 0.18); }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  h1 { font-size: 1.35rem; }
  .controls { display: flex; gap: 8px; }
  .controls button {
    width: 40px; height: 36px;
    padding: 0;
    font-size: 0.95rem;
    background: var(--chip-bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button {
    font-family: inherit;
    padding: 10px 16px;
    font-size: 0.95rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.05s;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: default; }
  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #loc { flex-shrink: 0; background: var(--chip-bg); color: var(--text); border: 1px solid var(--border); font-size: 1rem; padding: 10px 12px; }
  #loc:hover { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip {
    font-size: 0.82rem;
    padding: 4px 10px;
    background: var(--chip-bg);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .chip:hover { color: var(--accent); border-color: var(--accent); }
  .hidden { display: none !important; }
  #current {
    margin-top: 20px;
    text-align: center;
    min-height: 120px;
  }
  .place { font-size: 1.1rem; font-weight: 600; margin-bottom: 2px; }
  .country { font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; }
  .temp { font-size: 3rem; font-weight: 700; line-height: 1; }
  .temp .unit { font-size: 1.5rem; color: var(--muted); font-weight: 500; }
  .condition { color: var(--muted); margin-top: 8px; font-size: 0.95rem; }
  .condition .icon { font-size: 1.2rem; margin-right: 4px; }
  .details {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 18px;
  }
  .detail {
    background: var(--chip-bg);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .detail-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
  .detail-value { font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .arrow { color: var(--accent); }
  .section { margin-top: 22px; }
  .section h2 { font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  .sparkline { width: 100%; height: auto; display: block; }
  .sp-label { font-size: 11px; fill: var(--muted); }
  .sp-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .days { display: grid; grid-template-columns: repeat(7, minmax(64px, 1fr)); gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .day {
    background: var(--chip-bg);
    border-radius: 10px;
    padding: 10px 4px;
    text-align: center;
    min-width: 64px;
  }
  .day.today { outline: 2px solid var(--accent); }
  .day-name { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; }
  .day-icon { font-size: 1.3rem; margin: 6px 0 2px; }
  .day-precip { font-size: 0.7rem; color: #3b82f6; min-height: 14px; }
  .day-temps { font-size: 0.85rem; margin-top: 4px; }
  .day-temps .min { color: var(--muted); margin-right: 4px; }
  .day-temps .max { font-weight: 600; }
  #map {
    height: 320px;
    margin-top: 22px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    z-index: 0;
  }
  .foot { margin-top: 14px; text-align: center; font-size: 0.75rem; color: var(--muted); }
  .error {
    color: var(--error-text);
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    padding: 14px;
    border-radius: 10px;
    font-size: 0.92rem;
  }
  .skeleton {
    border-radius: 8px;
    background: linear-gradient(90deg, var(--chip-bg) 25%, var(--border) 50%, var(--chip-bg) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (max-width: 560px) {
    body { padding: 12px; }
    .card { padding: 20px 16px 12px; }
    form { flex-wrap: wrap; }
    input[type="text"] { flex: 1 1 100%; }
    #btn { flex: 1; }
    #loc { flex-shrink: 0; }
    .details { grid-template-columns: repeat(2, 1fr); }
    #map { height: 260px; }
  }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <main class="card">
    <header class="top">
      <h1>Météo</h1>
      <div class="controls">
        <button id="units" title="Changer d'unité">°F</button>
        <button id="theme" title="Changer de thème">☀</button>
      </div>
    </header>

    <form id="form">
      <input type="text" id="city" placeholder="Entrez une ville…" autocomplete="off" aria-label="Nom de la ville">
      <button type="submit" id="btn">Voir la météo</button>
      <button type="button" id="loc" title="Utiliser ma position">📍</button>
    </form>

    <div id="recent" class="chips hidden" aria-label="Recherches récentes"></div>

    <section id="current" aria-live="polite"></section>

    <section id="hourly-section" class="section hidden">
      <h2>Prochaines 24 heures</h2>
      <div id="hourly"></div>
    </section>

    <section id="daily-section" class="section hidden">
      <h2>7 prochains jours</h2>
      <div id="daily" class="days"></div>
    </section>

    <div id="map"></div>

    <footer class="foot">Données : Open-Meteo · Cartes : OpenStreetMap</footer>
  </main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WEATHER = {
  0: { label: "Ciel clair", icon: "☀️" },
  1: { label: "Peu nuageux", icon: "🌤️" },
  2: { label: "Partiellement nuageux", icon: "⛅" },
  3: { label: "Couvert", icon: "☁️" },
  45: { label: "Brouillard", icon: "🌫️" },
  48: { label: "Brouillard givrant", icon: "🌫️" },
  51: { label: "Pluie légère", icon: "🌦️" },
  53: { label: "Pluie modérée", icon: "🌧️" },
  55: { label: "Pluie forte", icon: "🌧️" },
  56: { label: "Pluie verglaçante légère", icon: "🌧️" },
  57: { label: "Pluie verglaçante forte", icon: "🌧️" },
  61: { label: "Pluie légère", icon: "🌦️" },
  63: { label: "Pluie modérée", icon: "🌧️" },
  65: { label: "Pluie forte", icon: "🌧️" },
  66: { label: "Pluie verglaçante légère", icon: "🌧️" },
  67: { label: "Pluie verglaçante forte", icon: "🌧️" },
  71: { label: "Neige légère", icon: "🌨️" },
  73: { label: "Neige modérée", icon: "🌨️" },
  75: { label: "Neige forte", icon: "❄️" },
  77: { label: "Grains de neige", icon: "❄️" },
  80: { label: "Averses légères", icon: "🌦️" },
  81: { label: "Averses modérées", icon: "🌧️" },
  82: { label: "Averses fortes", icon: "🌧️" },
  85: { label: "Averses de neige", icon: "🌨️" },
  86: { label: "Averses de neige fortes", icon: "🌨️" },
  95: { label: "Orage", icon: "⛈️" },
  96: { label: "Orage avec grêle", icon: "⛈️" },
  99: { label: "Orage violent avec grêle", icon: "⛈️" }
};

const LS = {
  lastCity: "meteo:lastCity",
  recent: "meteo:recent",
  units: "meteo:units",
  theme: "meteo:theme"
};

const form = document.getElementById("form");
const input = document.getElementById("city");
const btn = document.getElementById("btn");
const locBtn = document.getElementById("loc");
const bgEl = document.getElementById("bg");
const current = document.getElementById("current");
const hourlySection = document.getElementById("hourly-section");
const dailySection = document.getElementById("daily-section");
const hourlyEl = document.getElementById("hourly");
const dailyEl = document.getElementById("daily");
const recentEl = document.getElementById("recent");
const unitsBtn = document.getElementById("units");
const themeBtn = document.getElementById("theme");

let units = localStorage.getItem(LS.units) || "c";
let lastData = null;
let lastPlace = "";
let lastLat = null;
let lastLon = null;
let lastCountry = "";

let map = null;
let marker = null;
function initMap() {
  if (typeof L === "undefined" || !document.getElementById("map")) return;
  map = L.map("map", { zoomControl: true }).setView([20, 0], 2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  map.on("click", async (e) => {
    const { lat, lng } = e.latlng;
    await loadWeather({ lat, lon: lng, name: `${lat.toFixed(3)}, ${lng.toFixed(3)}` });
  });
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) { showError("Veuillez saisir une ville."); return; }
  try {
    setLoading();
    const place = await geocode(q);
    input.value = place.name;
    await loadWeather(place);
  } catch (err) {
    showError(err.message || "Une erreur est survenue. Réessayez.");
  }
});

locBtn.addEventListener("click", () => {
  if (!navigator.geolocation) { showError("La géolocalisation n'est pas supportée par votre navigateur."); return; }
  setLoading();
  navigator.geolocation.getCurrentPosition(
    (pos) => loadWeather({ lat: pos.coords.latitude, lon: pos.coords.longitude, name: "Ma position" }),
    () => showError("Impossible d'obtenir votre position.")
  );
});

unitsBtn.addEventListener("click", () => {
  units = units === "c" ? "f" : "c";
  localStorage.setItem(LS.units, units);
  initUnits();
  if (lastData) render(lastData, lastPlace, lastLat, lastLon, lastCountry);
});

themeBtn.addEventListener("click", () => {
  const dark = document.documentElement.classList.toggle("dark");
  localStorage.setItem(LS.theme, dark ? "dark" : "light");
  themeBtn.textContent = dark ? "☀" : "🌙";
});

recentEl.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  input.value = chip.dataset.city;
  form.requestSubmit();
});

function initTheme() {
  const saved = localStorage.getItem(LS.theme);
  const dark = saved ? saved === "dark" : false;
  document.documentElement.classList.toggle("dark", dark);
  themeBtn.textContent = dark ? "☀" : "🌙";
}

function initUnits() {
  unitsBtn.textContent = units === "c" ? "°F" : "°C";
}

const BG_PALETTES = {
  "clear-day": { g: "linear-gradient(135deg, #38bdf8 0%, #7dd3fc 45%, #fde68a 100%)" },
  "clear-night": { g: "linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #312e81 100%)" },
  "partly-day": { g: "linear-gradient(135deg, #60a5fa 0%, #93c5fd 45%, #fde68a 100%)" },
  "partly-night": { g: "linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #312e81 100%)" },
  "cloud-day": { g: "linear-gradient(135deg, #94a3b8 0%, #cbd5e1 55%, #bae6fd 100%)" },
  "cloud-night": { g: "linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #334155 100%)" },
  "rain-day": { g: "linear-gradient(135deg, #475569 0%, #64748b 50%, #94a3b8 100%)" },
  "rain-night": { g: "linear-gradient(135deg, #0b1220 0%, #1e293b 55%, #334155 100%)" },
  "snow": { g: "linear-gradient(135deg, #bfdbfe 0%, #e0f2fe 55%, #f8fafc 100%)" },
  "fog": { g: "linear-gradient(135deg, #94a3b8 0%, #cbd5e1 50%, #e2e8f0 100%)" },
  "storm-day": { g: "linear-gradient(135deg, #4c1d95 0%, #64748b 50%, #94a3b8 100%)" },
  "storm-night": { g: "linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e293b 100%)" }
};

function weatherThemeKey(code, isDay) {
  if (code >= 45 && code <= 48) return "fog";
  if (code >= 51 && code <= 67) return isDay ? "rain-day" : "rain-night";
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
  if (code >= 80 && code <= 82) return isDay ? "rain-day" : "rain-night";
  if (code >= 95 && code <= 99) return isDay ? "storm-day" : "storm-night";
  if (code === 1 || code === 2) return isDay ? "partly-day" : "partly-night";
  if (code === 3) return isDay ? "cloud-day" : "cloud-night";
  return isDay ? "clear-day" : "clear-night";
}

function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function buildStars(rand) {
  let html = "";
  for (let i = 0; i < 42; i++) {
    const x = (rand() * 100).toFixed(1);
    const y = (rand() * 55).toFixed(1);
    const s = (rand() * 1.8 + 1).toFixed(1);
    const d = (rand() * 3 + 1.5).toFixed(1);
    const delay = (rand() * 3).toFixed(1);
    html += `<span class="star" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;animation-duration:${d}s;animation-delay:-${delay}s"></span>`;
  }
  return html;
}

function buildClouds(rand, count, dark) {
  let html = "";
  for (let i = 0; i < count; i++) {
    const w = (rand() * 130 + 90).toFixed(0);
    const top = (rand() * 42 + 6).toFixed(0);
    const dur = (rand() * 55 + 38).toFixed(0);
    const delay = (-rand() * dur).toFixed(0);
    const op = (rand() * 0.3 + 0.62).toFixed(2);
    const bg = dark
      ? `rgba(71, 85, 105, ${(rand() * 0.3 + 0.5).toFixed(2)})`
      : `rgba(255, 255, 255, ${op})`;
    html += `<div class="cloud" style="top:${top}%;width:${w}px;height:${(w * 0.35).toFixed(0)}px;background:${bg};animation-duration:${dur}s;animation-delay:${delay}s"></div>`;
  }
  return html;
}

function buildRain(rand) {
  let html = "";
  for (let i = 0; i < 45; i++) {
    const left = (rand() * 100).toFixed(1);
    const h = (rand() * 20 + 12).toFixed(0);
    const dur = (rand() * 0.7 + 0.5).toFixed(2);
    const delay = (-rand() * dur).toFixed(2);
    html += `<span class="rain" style="left:${left}%;height:${h}px;animation-duration:${dur}s;animation-delay:${delay}s"></span>`;
  }
  return html;
}

function buildSnow(rand) {
  let html = "";
  for (let i = 0; i < 45; i++) {
    const left = (rand() * 100).toFixed(1);
    const s = (rand() * 4 + 3).toFixed(1);
    const dur = (rand() * 3 + 4).toFixed(1);
    const delay = (-rand() * dur).toFixed(1);
    html += `<span class="snow" style="left:${left}%;width:${s}px;height:${s}px;animation-duration:${dur}s;animation-delay:${delay}s"></span>`;
  }
  return html;
}

function buildFog(rand) {
  let html = "";
  for (let i = 0; i < 3; i++) {
    const top = (rand() * 55 + 22).toFixed(0);
    const dur = (rand() * 12 + 18).toFixed(1);
    const delay = (-rand() * 4).toFixed(1);
    html += `<div class="fog-bank" style="top:${top}%;animation-duration:${dur}s;animation-delay:${delay}s"></div>`;
  }
  return html;
}

function buildScene(key) {
  const rand = mulberry32(hashString(key));
  const moon = (op) => `<div class="moon" style="opacity:${op}"></div>`;
  switch (key) {
    case "clear-day":
      return `<div class="sun"></div>` + buildClouds(rand, 1, false);
    case "clear-night":
      return buildStars(rand) + moon("1") + buildClouds(rand, 1, true);
    case "partly-day":
      return `<div class="sun"></div>` + buildClouds(rand, 3, false);
    case "partly-night":
      return buildStars(rand) + moon("1") + buildClouds(rand, 3, true);
    case "cloud-day":
      return buildClouds(rand, 4, false);
    case "cloud-night":
      return buildStars(rand) + moon("0.5") + buildClouds(rand, 4, true);
    case "rain-day":
      return buildClouds(rand, 4, false) + buildRain(rand);
    case "rain-night":
      return buildStars(rand) + moon("0.4") + buildClouds(rand, 4, true) + buildRain(rand);
    case "snow":
      return buildClouds(rand, 3, false) + buildSnow(rand);
    case "fog":
      return buildFog(rand) + buildClouds(rand, 2, false);
    case "storm-day":
      return buildClouds(rand, 4, true) + buildRain(rand) + `<div class="flash"></div>`;
    case "storm-night":
      return buildStars(rand) + moon("0.35") + buildClouds(rand, 4, true) + buildRain(rand) + `<div class="flash"></div>`;
    default:
      return "";
  }
}

let currentBg = null;
function setBg(code, isDay) {
  const key = weatherThemeKey(code, isDay);
  const t = BG_PALETTES[key];
  const layer = document.createElement("div");
  layer.className = "bg-layer";
  layer.style.background = t.g;
  layer.innerHTML = buildScene(key);
  bgEl.appendChild(layer);
  const prev = currentBg;
  currentBg = layer;
  if (prev) {
    requestAnimationFrame(() => {
      layer.classList.add("show");
      prev.classList.remove("show");
      setTimeout(() => prev.remove(), 1100);
    });
  } else {
    layer.classList.add("show");
  }
}

async function geocode(city) {
  const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=fr`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("Erreur de connexion au service de géocodage.");
  const data = await res.json();
  if (!data.results || data.results.length === 0) {
    throw new Error("Ville introuvable. Vérifiez le nom et réessayez.");
  }
  const r = data.results[0];
  return { lat: r.latitude, lon: r.longitude, name: r.name, country: r.country };
}

async function getForecast(lat, lon) {
  const params = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m,is_day",
    hourly: "temperature_2m",
    forecast_hours: "24",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
    timezone: "auto"
  });
  const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
  if (!res.ok) throw new Error("Erreur de connexion au service météo.");
  return await res.json();
}

async function loadWeather(place) {
  setLoading();
  try {
    const data = await getForecast(place.lat, place.lon);
    lastData = data;
    lastPlace = place.name;
    lastLat = place.lat;
    lastLon = place.lon;
    lastCountry = place.country || "";
    render(data, place.name, place.lat, place.lon, place.country);
    if (place.name !== "Ma position" && place.name.includes(",") === false) saveRecent(place.name);
  } catch (err) {
    showError(err.message || "Une erreur est survenue. Réessayez.");
  }
}

function render(data, placeName, lat, lon, country) {
  const cur = data.current;
  const w = getWeather(cur.weather_code);
  current.className = "";
  setBg(cur.weather_code, cur.is_day);

  current.innerHTML = `
    <div class="place">${escapeHtml(placeName)}</div>
    ${country ? `<div class="country">${escapeHtml(country)}</div>` : ""}
    <div class="temp">${formatTemp(cur.temperature_2m)}</div>
    <div class="condition"><span class="icon">${w.icon}</span>${escapeHtml(w.label)}</div>
    <div class="details">
      <div class="detail">
        <div class="detail-label">Ressenti</div>
        <div class="detail-value">${formatTemp(cur.apparent_temperature)}</div>
      </div>
      <div class="detail">
        <div class="detail-label">Humidité</div>
        <div class="detail-value">${cur.relative_humidity_2m}%</div>
      </div>
      <div class="detail">
        <div class="detail-label">Vent</div>
        <div class="detail-value">
          <span class="arrow">${arrowSvg(cur.wind_direction_10m)}</span>
          ${Math.round(cur.wind_speed_10m)} km/h
        </div>
      </div>
      <div class="detail">
        <div class="detail-label">Pression</div>
        <div class="detail-value">${Math.round(cur.surface_pressure)} hPa</div>
      </div>
    </div>
  `;

  hourlyEl.innerHTML = buildSparkline(data.hourly.time, data.hourly.temperature_2m);
  dailyEl.innerHTML = buildDays(data.daily);
  hourlySection.classList.remove("hidden");
  dailySection.classList.remove("hidden");

  placeMarker(lat, lon, placeName, cur);
}

function getWeather(code) {
  return WEATHER[code] || { label: "Conditions inconnues", icon: "🌡️" };
}

function formatTemp(c) {
  const v = units === "f" ? (c * 9) / 5 + 32 : c;
  return `${Math.round(v)}°${units === "f" ? "F" : "C"}`;
}

function arrowSvg(deg) {
  return `<svg width="16" height="16" viewBox="0 0 24 24" style="transform:rotate(${deg}deg)"><path d="M12 2 L20 22 L12 16 L4 22 Z" fill="currentColor"/></svg>`;
}

function buildSparkline(times, temps) {
  const W = 720, H = 150, PAD = 10, TOP = 26, BOT = 30;
  const n = temps.length;
  if (n < 2) return "";
  let min = Math.min(...temps), max = Math.max(...temps);
  if (max - min < 2) { max += 1; min -= 1; }
  const span = max - min;
  const x = (i) => PAD + (i * (W - 2 * PAD)) / (n - 1);
  const y = (t) => TOP + ((max - t) * (H - TOP - BOT)) / span;

  const pts = temps.map((t, i) => `${x(i).toFixed(1)},${y(t).toFixed(1)}`).join(" ");
  const line = `<polyline points="${pts}" class="sp-line"/>`;
  const area = `<path d="M${x(0)},${y(temps[0])} L${temps.map((t, i) => `${x(i)},${y(t)}`).join(" L")} L${x(n - 1)},${H - BOT} L${x(0)},${H - BOT} Z" fill="url(#grad)"/>`;

  const step = Math.ceil(n / 4);
  const labels = [];
  for (let i = 0; i < n; i += step) {
    labels.push(`<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="sp-label">${new Date(times[i]).getHours()}h</text>`);
  }

  return `<svg viewBox="0 0 ${W} ${H}" class="sparkline" role="img" aria-label="Températures prévues sur les prochaines 24 heures">
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    <text x="${PAD}" y="${TOP - 8}" class="sp-label">${Math.round(max)}°</text>
    <text x="${PAD}" y="${H - 12}" class="sp-label">${Math.round(min)}°</text>
    ${labels.join("")}
    ${area}
    ${line}
  </svg>`;
}

function buildDays(daily) {
  return daily.time.map((d, i) => {
    const w = getWeather(daily.weather_code[i]);
    const dt = new Date(d + "T00:00:00");
    const day = dt.toLocaleDateString("fr-FR", { weekday: "short" });
    const precip = daily.precipitation_probability_max[i];
    return `<div class="day${i === 0 ? " today" : ""}">
      <div class="day-name">${i === 0 ? "Auj." : escapeHtml(day)}</div>
      <div class="day-icon">${w.icon}</div>
      <div class="day-precip">${precip != null ? precip + "%" : ""}</div>
      <div class="day-temps"><span class="min">${formatTemp(daily.temperature_2m_min[i])}</span><span class="max">${formatTemp(daily.temperature_2m_max[i])}</span></div>
    </div>`;
  }).join("");
}

function placeMarker(lat, lon, placeName, cur) {
  if (!map) return;
  const w = getWeather(cur.weather_code);
  const popup = `<strong>${escapeHtml(placeName)}</strong><br>${formatTemp(cur.temperature_2m)} — ${escapeHtml(w.label)}`;
  if (marker) marker.remove();
  marker = L.marker([lat, lon]).addTo(map).bindPopup(popup).openPopup();
  map.setView([lat, lon], 11);
}

function setLoading() {
  current.className = "";
  current.innerHTML = `
    <div class="skeleton" style="width:55%;height:20px;margin:0 auto 4px"></div>
    <div class="skeleton" style="width:30%;height:14px;margin:0 auto 14px"></div>
    <div class="skeleton" style="width:38%;height:48px;margin:0 auto 12px"></div>
    <div class="skeleton" style="width:50%;height:16px;margin:0 auto"></div>
  `;
  hourlySection.classList.add("hidden");
  dailySection.classList.add("hidden");
}

function showError(message) {
  current.className = "error";
  current.textContent = message;
  hourlySection.classList.add("hidden");
  dailySection.classList.add("hidden");
}

function saveRecent(city) {
  let rec = getRecent();
  rec = [city, ...rec.filter((c) => c.toLowerCase() !== city.toLowerCase())].slice(0, 5);
  localStorage.setItem(LS.recent, JSON.stringify(rec));
  renderRecent();
}

function getRecent() {
  try { return JSON.parse(localStorage.getItem(LS.recent)) || []; } catch { return []; }
}

function renderRecent() {
  const rec = getRecent();
  recentEl.innerHTML = rec.map((c) => `<button type="button" class="chip" data-city="${escapeAttr(c)}">${escapeHtml(c)}</button>`).join("");
  recentEl.classList.toggle("hidden", rec.length === 0);
}

function restoreLastCity() {
  const last = localStorage.getItem(LS.lastCity);
  if (!last) return;
  input.value = last;
  form.requestSubmit();
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, "&quot;");
}

function persistLastCity() {
  const city = input.value.trim();
  if (city) localStorage.setItem(LS.lastCity, city);
}
window.addEventListener("beforeunload", persistLastCity);

initTheme();
initUnits();
renderRecent();
initMap();
setBg(0, 1);
restoreLastCity();
</script>
